
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Escala Mensal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <h1>Escala Mensal</h1>


    <!-- CONTROLES -->

    <div class="controles">

        <div>

            <label>Mês</label>

            <select id="mes">

                <option value="0">Janeiro</option>
                <option value="1">Fevereiro</option>
                <option value="2">Março</option>
                <option value="3">Abril</option>
                <option value="4">Maio</option>
                <option value="5">Junho</option>
                <option value="6">Julho</option>
                <option value="7">Agosto</option>
                <option value="8">Setembro</option>
                <option value="9">Outubro</option>
                <option value="10">Novembro</option>
                <option value="11">Dezembro</option>

            </select>

        </div>


        <div>

            <label>Ano</label>

            <input
                type="number"
                id="ano"
                min="2020"
                max="2100"
            >

        </div>


        <button onclick="mostrarEscala()">
            Mostrar Escala
        </button>


        <button
            class="novo"
            onclick="cadastrarFuncionario()"
        >
            + Funcionário
        </button>


        <button
            class="validar"
            onclick="validarEscala()"
        >
            ✓ Validar Escala
        </button>

    </div>


    <!-- LEGENDA -->

    <div class="legenda">

        <span>🟢 Trabalho</span>

        <span>🔴 Folga</span>

        <span>🟡 Férias</span>

        <span>🔵 Atestado</span>

        <span>⚪ Outro</span>

        <span>🔴 Problema</span>

    </div>


    <!-- RESULTADO -->

    <div id="resultado-validacao"></div>


    <!-- ESCALA -->

    <div class="escala-container">

        <table id="tabela">

            <thead id="cabecalho"></thead>

            <tbody id="corpo"></tbody>

        </table>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
